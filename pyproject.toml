[project]
name = "arango-sparql-py"
version = "0.1.0"
description = "Python-native SPARQL 1.1 to AQL transpiler for ArangoDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "python-arango>=8.1.1",
  "rdflib>=7.0",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.20.0",
  "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/ArthurKeen/arango-sparql-py"
Repository = "https://github.com/ArthurKeen/arango-sparql-py"
Issues = "https://github.com/ArthurKeen/arango-sparql-py/issues"

[tool.hatch.metadata]
# The nl extra git-pins arango-query-core (deliberate, CC-9); hatchling
# requires this flag for direct references.
allow-direct-references = true

[project.optional-dependencies]
analyzer = [
  # Mirror arango-cypher-py: pin the schema analyzer band so
  # service installs fail fast on heuristic mappings. 0.9.0 floor: adds
  # named-graph membership (metadata.graphMembership + per-entry graphs),
  # graphScope, CSI v1, GraphRAG detection, and gold/metric-history.
  # The ``[anthropic,openai]`` extras pull both client SDKs so the analyzer
  # runs its LLM-backed classification with whichever provider the
  # environment supplies a key for (resolved by
  # arango_sparql/schema/acquire.py::_resolve_analyzer_provider). Without a
  # client SDK it silently degrades to deterministic baseline inference,
  # which misclassifies LABEL-style / hybrid collections.
  "arangodb-schema-analyzer[anthropic,openai]>=0.9.0,<0.10.0",
]
service = [
  "arango-sparql-py[analyzer]",
  "typer>=0.9.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
]
cli = [
  "typer>=0.9.0",
  "rich>=13.0.0",
]
nl = [
  "openai>=1.0.0",
  "anthropic>=0.20.0",
  "rank_bm25>=0.2.2",
  "PyYAML>=6.0.0",
  # Shared NL engine + adapter seams + conceptual-model substrate
  # (NLQueryEngine, seam protocols, DenseRetriever) driving BOTH the nl2sparql
  # pipeline and the shared-engine _core/adapter (nl-engine-extraction, PRD
  # §12.3). Sourced from the ArthurKeen upstream (dev'd first; arango-solutions
  # is the synced mirror), git-pinned to an exact commit (deterministic; bump
  # deliberately — CC-9: consumers re-run goldens). 8adc0de is the ArthurKeen
  # HEAD and a superset of the prior c6ae5e1 pin — it carries the Phase-7.4
  # predicate/schema-convention grounding seam (arango_query_core.nl.grounding.
  # {GroundedPredicate,PredicateIndex}, QueryLanguageAdapter.predicate_index()/
  # predicate_prompt_section() (seam 7), NLQueryEngine.predicate_k) the
  # predicate-grounding workstream imports.
  "arango-query-core @ git+https://github.com/ArthurKeen/arango-query-core@b66932046a102898e8fff205a7ddcbedfb2c896e",
]
# Torch-free-by-default packaging (D-05 packaging discretion, Phase 7 07-03):
# a plain `pip install '.[nl]'` never pulls sentence-transformers/torch — the
# production `SparqlAdapter.few_shot_index()` seam defaults to `mode="auto"`
# and gracefully degrades to BM25/no-op without it. Installing `.[dense]` is
# the ONLY path that pulls torch, composing arango-query-core's own `[dense]`
# extra (sentence-transformers) on top of `[nl]`'s deps.
dense = [
  "arango-sparql-py[nl]",
  "arango-query-core[dense] @ git+https://github.com/ArthurKeen/arango-query-core@b66932046a102898e8fff205a7ddcbedfb2c896e",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff==0.15.22",
  "mypy>=1.11",
  "httpx>=0.24.0",
  "PyYAML>=6.0.0",
  # pyoxigraph is the W3C-compliant reference triplestore for
  # cross-validation tests (analog of Neo4j in arango-cypher-py).
  "pyoxigraph>=0.3.22",
  "arango-sparql-py[analyzer]",
  "typer>=0.9.0",
  # SPARQLWrapper is the exact client PRD §11.1 names as the automated
  # third-party-tool compat target (D-06).
  "SPARQLWrapper>=2.0.0",
]

[project.scripts]
arango-sparql-py = "arango_sparql.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a running ArangoDB (see README); use docker-compose.yml",
  "w3c: SPARQL 1.1 W3C DAWG evaluation harness",
  "cross: cross-validates transpiled AQL bindings against pyoxigraph as the W3C reference store",
  "eval: NL->SPARQL evaluation harness; slow, gated behind RUN_EVAL=1",
  "perf: performance budget enforcement (see PRD §9.4); CI-blocking on >25% p95 regression for the fast in-process rows",
]

# Static typing starts where the correctness risk is highest — the
# translate package (parser → visitor → builder → resolver). Widen the
# `files` list as other packages are annotated; do not turn on
# `strict` until visitor.py's algebra boundary has real types.
[tool.mypy]
files = ["arango_sparql/translate"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401", "F841"]
"scripts/**/*.py" = ["E402"]
"arango_sparql/service/__init__.py" = ["F401", "E402", "I001"]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arango_sparql"]
