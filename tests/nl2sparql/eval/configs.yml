# Provider/judge configs consumed by tests/nl2sparql/eval/runner.py::run(config_name).
#
# Each entry under `configs:` selects an LLMClient (arango_sparql/nl2sparql/client.py)
# via `provider.type`, a judge strategy, and the pipeline's `max_repairs` bound.
#
# `provider.type` values map 1:1 onto the runner's client factory branches:
#   scripted          -> ScriptedLLMClient (no network; the CI default)
#   openai|openrouter -> OpenAICompatibleClient
#   anthropic         -> AnthropicClient
#
# Real-provider credentials are NEVER stored here — they are read from the
# NL2SPARQL_* environment variables (see arango_sparql/nl2sparql/client.py) only
# when a non-scripted config is actually run. This file is checked into VCS as
# trusted repo data; it holds no credentials. The optional `few_shot:` block
# (added Phase 7 07-04) is likewise config-only data (mode + k) — it never
# carries a bank path override or any credential; the bank file itself lives
# at tests/nl2sparql/eval/fewshot_bank.yml (07-02), trusted repo data.
#
# The optional `grounding:` block (added Phase 07.3-05) is the entity/instance
# grounding seam's config-only data (k + label_predicates) — runner.py builds
# a LabelIndex from the corpus's `data_path:` instance graph ONCE per run and
# threads it into every case's NlPipeline. Absent `grounding:` == today's
# ungrounded behavior. `label_predicates:` is declarative, reviewable config
# — any dataset-specific predicate (e.g. CK25's product-vocab name predicate)
# lives ONLY here, never hardcoded in runner.py.

configs:
  # The CI default: no network, deterministic, gates baseline.json.
  scripted:
    provider:
      type: scripted
    judge: canonical
    max_repairs: 2

  # Documents the real-provider sweep shape. Not run in CI — nightly/manual only.
  openai-gpt4o-mini:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2

  # --------------------------------------------------------------------
  # Phase 07.1-06: per-set QALD-9-plus / CK25 configs via the additive
  # `corpus:` key (07.1-01 / RESEARCH Pattern 1). Two jobs, two sets
  # (D-02/D-03): QALD is the powered gate, CK25 is the reported (un-gated)
  # corporate-domain anchor — each gets its OWN scripted + live config and
  # its OWN baseline.json entry, never blended into the hand-authored
  # `scripted` corpus above (Pitfall 3).
  # --------------------------------------------------------------------

  # QALD-9-plus — no network, deterministic; gates its OWN baseline.json entry.
  scripted-qald9plus:
    provider:
      type: scripted
    judge: canonical
    max_repairs: 2
    corpus: vendored/qald9plus/corpus.yml

  # CK25 — no network, deterministic; gates its OWN baseline.json entry.
  # 07.2: flipped to judge: execution in place (D-06) — CK25's corpus-level
  # data_path vendors a real instance graph, so answer-set execution grading
  # applies here (unlike the hand-authored `scripted` corpus above).
  scripted-ck25:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml

  # Live QALD-9-plus sweep — documents the real-provider shape. Not run in
  # CI — gated behind RUN_EVAL=1 + NL2SPARQL_API_KEY, human-run (README §3).
  openai-gpt4o-mini-qald9plus:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2
    corpus: vendored/qald9plus/corpus.yml

  # Live CK25 sweep — same discipline as above.
  # 07.2: flipped to judge: execution in place (D-06) — same rationale as
  # scripted-ck25 above.
  openai-gpt4o-mini-ck25:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml

  # --------------------------------------------------------------------
  # Phase 07.3-05: entity/instance grounding (seam 6) additive `grounding:`
  # block on top of the CK25 execution-judged configs above. `pv:name`
  # appears ONLY in this `label_predicates:` list (declarative, reviewable
  # config) — never hardcoded in runner.py (grep gate == 0). scripted-
  # ck25-grounded is a PLUMBING gate only (config -> build_label_index ->
  # seam -> prompt -> judge does not crash) — it is NOT accuracy evidence
  # (RESEARCH Pitfall 5); scripted stays the CI default regardless.
  # --------------------------------------------------------------------

  # CK25 grounded — no network, deterministic; plumbing gate (Pitfall 5).
  scripted-ck25-grounded:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates: ["rdfs:label", "pv:name"]

  # Live CK25 grounded sweep — same discipline as openai-gpt4o-mini-ck25
  # above. Not run in CI — gated behind RUN_EVAL=1 + NL2SPARQL_API_KEY,
  # human-run.
  #
  # Plan 07.3-06 Task 1 (RESEARCH Open Question 1) — temperature provenance:
  # this config has no `temperature:` key (none is read anywhere in this
  # file); runner.py::_client_for() constructs OpenAICompatibleClient(
  # provider=ptype, model=provider.get("model")) with no explicit
  # `temperature=` argument, so it falls through to
  # OpenAICompatibleClient.__init__'s hardcoded default `temperature: float
  # = 0.1` (arango_sparql/nl2sparql/client.py). gpt-4o-mini is not a
  # _is_reasoning_model() match, so 0.1 IS sent explicitly on every call.
  # This is the SAME 0.1 already recorded in baseline.json's committed
  # openai-gpt4o-mini-ck25 entry -- so a live re-run of that config this
  # session (the fresh zero arm) and this grounded config both run at 0.1,
  # not the spike's temperature=0 (grounding_spike.py hardcoded 0 in its raw
  # HTTP call). A non-reproduction of the spike's exact 6/49->12/49 numbers
  # is therefore attributable to this temperature delta, not to grounding
  # failing -- record `"temperature": 0.1` in the baseline.json fold-in
  # (Task 3), not the spike's 0.
  openai-gpt4o-mini-ck25-grounded:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates: ["rdfs:label", "pv:name"]

  # --------------------------------------------------------------------
  # Phase 7 07-04: 3-arm (zero/dense/bm25) x 3-model (gpt-4o-mini anchor,
  # gpt-5-mini, gpt-5) matrix. All additive; `few_shot` absent == today's
  # zero-shot behavior. Not run in CI — gated behind RUN_EVAL=1 +
  # NL2SPARQL_API_KEY per the Task 4 human-run sweep (README §7).
  # --------------------------------------------------------------------

  # gpt-4o-mini — the anchor model (06.2's committed live baseline).
  openai-gpt4o-mini-dense:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: dense
      k: 3

  openai-gpt4o-mini-bm25:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: bm25
      k: 3

  # gpt-5-mini — mid capability tier (exploratory per D-08/m1).
  openai-gpt5-mini:
    provider:
      type: openai
      model: gpt-5-mini
    judge: canonical
    max_repairs: 2

  openai-gpt5-mini-dense:
    provider:
      type: openai
      model: gpt-5-mini
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: dense
      k: 3

  openai-gpt5-mini-bm25:
    provider:
      type: openai
      model: gpt-5-mini
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: bm25
      k: 3

  # gpt-5 — flagship / deliberate ceiling-effect stress test (exploratory).
  openai-gpt5:
    provider:
      type: openai
      model: gpt-5
    judge: canonical
    max_repairs: 2

  openai-gpt5-dense:
    provider:
      type: openai
      model: gpt-5
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: dense
      k: 3

  openai-gpt5-bm25:
    provider:
      type: openai
      model: gpt-5
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: bm25
      k: 3
